<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 01 - XML và HTML</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .result { margin-top: 15px; padding: 12px; background: #e9ecef; border-left: 4px solid #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Bài 01: Tìm họ tên nhân viên mã 002</h2>
    <div id="ketQua" class="result">Đang tải dữ liệu...</div>
</div>

<script>
    async function chayBai01() {
        try {
            let response = await fetch('danhsachnhanvien.xml');
            let textData = await response.text();
            let parser = new DOMParser();
            let xmlDoc = parser.parseFromString(textData, "text/xml");

            let nhanViens = xmlDoc.getElementsByTagName("nhanvien");
            let ketQuaStr = "Không tìm thấy nhân viên.";

            for (let nv of nhanViens) {
                let manv = nv.getElementsByTagName("manv")[0].textContent.trim();
                if (manv === "002") {
                    let hoten = nv.getElementsByTagName("hoten")[0].textContent.trim();
                    ketQuaStr = `Họ tên nhân viên có mã 002 là: ${hoten}`;
                    break;
                }
            }
            document.getElementById("ketQua").innerText = ketQuaStr;
        } catch (error) {
            document.getElementById("ketQua").innerText = "Lỗi: Hãy chắc chắn bạn đang chạy bằng Live Server!";
        }
    }

    chayBai01();
</script>

</body>
</html>
